    function sanitizeText(str, maxLen = 300) {
      if (typeof str !== 'string') return '';
      return str
        .replace(/[ -]/g, ' ')
        .replace(/javascript:|data:/gi, '')
        .trim()
        .slice(0, maxLen);
    }

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function safeJsonParse(raw, fallback) {
      try {
        if (!raw) return fallback;
        const parsed = JSON.parse(raw, (key, value) => {
          if (key === '__proto__' || key === 'constructor' || key === 'prototype') return undefined;
          return value;
        });
        return parsed ?? fallback;
      } catch {
        return fallback;
      }
    }

    async function hashPasswordPBKDF2(password, saltHex) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        'raw',
        enc.encode(password),
        { name: 'PBKDF2' },
        false,
        ['deriveBits']
      );
      const saltBytes = new Uint8Array(saltHex.match(/.{1,2}/g).map(b => parseInt(b, 16)));
      const bits = await crypto.subtle.deriveBits(
        { name: 'PBKDF2', salt: saltBytes, iterations: 100000, hash: 'SHA-256' },
        keyMaterial,
        256
      );
      return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function generateSaltHex() {
      const arr = new Uint8Array(16);
      crypto.getRandomValues(arr);
      return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function parsePdfFile(file) {
      if (file.size > MAX_FILE_BYTES) {
        throw new Error('File troppo grande (max 35 MB)');
      }
      const buffer = await file.arrayBuffer();
      const header = new Uint8Array(buffer.slice(0, 5));
      const signature = String.fromCharCode(...header);
      if (signature !== '%PDF-') {
        throw new Error('Formato PDF non valido');
      }
      if (!window.pdfjsLib) {
        return {
          numPages: 1,
          pages: [{ pageNumber: 1, text: `Documento ${file.name}` }]
        };
      }
      const loadingTask = window.pdfjsLib.getDocument({
        data: buffer,
        isEvalSupported: false,
      });
      const pdf = await loadingTask.promise;
      const limit = Math.min(pdf.numPages, MAX_PAGES_PER_FILE);
      const pages = [];
      for (let i = 1; i <= limit; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        const text = content.items.map(it => it.str).join(' ').replace(/\s+/g, ' ').trim();
        pages.push({ pageNumber: i, text });
      }
      return { numPages: limit, pages };
    }

    function buildQuestionsFromDocs(docs, count, t) {
      const candidates = [];
      const keywordPool = new Set();

      docs.forEach(doc => {
        (doc.pages || []).forEach(p => {
          if (!p.text || p.text.length < 30) return;
          const sentences = p.text
            .split(/(?<=[.!?])\s+/)
            .map(s => s.trim())
            .filter(s => s.length >= 40 && s.length <= 240);

          sentences.forEach(sentence => {
            const words = sentence
              .replace(/[.,;:!?()"«»]/g, '')
              .split(/\s+/)
              .filter(w => w.length >= 5 && !/^\d+$/.test(w));

            words.forEach(w => keywordPool.add(w));

            if (words.length >= 4) {
              const sorted = [...words].sort((a, b) => b.length - a.length);
              const targetWord = sorted[0];
              if (targetWord && targetWord.length >= 5) {
                const regex = new RegExp(`\\b${escapeRegExp(targetWord)}\\b`);
                if (regex.test(sentence)) {
                  const masked = sentence.replace(regex, '________');
                  candidates.push({
                    docId: doc.id,
                    docName: doc.name,
                    pageNumber: p.pageNumber,
                    originalSentence: sentence,
                    maskedSentence: masked,
                    answer: targetWord,
                  });
                }
              }
            }
          });
        });
      });

      const allKeywords = Array.from(keywordPool);

      if (candidates.length === 0) {
        return Array.from({ length: count }, (_, idx) => {
          const doc = docs[idx % docs.length];
          const pageNum = Math.min(idx + 1, doc.numPages || 1);
          const pageObj = (doc.pages && doc.pages[pageNum - 1]) || { text: doc.name };
          return {
            id: `q-${idx}-${Date.now()}`,
            docId: doc.id,
            docName: doc.name,
            pageNumber: pageNum,
            prompt: `${t.fillBlankPrompt} "${doc.name}" (${t.pageRef} ${pageNum}):`,
            quote: pageObj.text.slice(0, 220) || doc.name,
            options: [
              `${doc.name.replace(/\.pdf$/i, '')} — Concetto chiave`,
              'Definizione secondaria non pertinente',
              'Ipotesi preliminare esclusa dal testo',
              'Parametro esterno non citato nella dispensa'
            ],
            correctAnswer: `${doc.name.replace(/\.pdf$/i, '')} — Concetto chiave`,
            explanation: pageObj.text.slice(0, 240) || `Riferimento a pagina ${pageNum} di ${doc.name}.`
          };
        });
      }

      const shuffled = [...candidates].sort(() => Math.random() - 0.5);
      const selected = [];
      for (let i = 0; i < count; i++) {
        const item = shuffled[i % shuffled.length];
        const distractors = allKeywords
          .filter(w => w.toLowerCase() !== item.answer.toLowerCase())
          .sort(() => Math.random() - 0.5)
          .slice(0, 3);

        while (distractors.length < 3) {
          distractors.push(`Termine ${distractors.length + 1}`);
        }

        const options = [item.answer, ...distractors].sort(() => Math.random() - 0.5);

        selected.push({
          id: `q-${i}-${Date.now()}`,
          docId: item.docId,
          docName: item.docName,
          pageNumber: item.pageNumber,
          prompt: `${t.fillBlankPrompt} "${item.docName}":`,
          quote: item.maskedSentence,
          options,
          correctAnswer: item.answer,
          explanation: item.originalSentence,
        });
      }

      return selected;
    }

        const files = Array.from(fileList || []).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
        if (files.length === 0) return;

        const remainingSlots = Math.max(0, MAX_FILES - docs.length);
        const batch = files.slice(0, remainingSlots);
        if (batch.length === 0) return;

        setIsParsing(true);
        const added = [];
        for (const f of batch) {
          try {
            const parsed = await parsePdfFile(f);
            added.push({
              id: `doc-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
              name: sanitizeText(f.name, 120),
              folderId: uploadTargetFolder || '',
              numPages: parsed.numPages,
              pages: parsed.pages,
            });
          } catch {}
        }

        if (added.length > 0) {
          setDocs(prev => [...prev, ...added]);
          setSelectedDocIds(prev => [...new Set([...prev, ...added.map(d => d.id)])]);
        }
        setIsParsing(false);

        if (selectedOption !== null) return;

        const isCorrect = option === currentQ.correctAnswer;
        setSelectedOption(option);
        setAnswersLog(prev => [...prev, { question: currentQ, chosen: option, isCorrect }]);
        if (isCorrect) {
          setNailedItStamp(true);
          setTimeout(() => setNailedItStamp(false), 1400);

      };

      const advanceToNext = useCallback(() => {
        if (currentIndex + 1 < sessionQuestions.length) {
          setCurrentIndex(prev => prev + 1);
          setSelectedOption(null);
          setNailedItStamp(false);
          setExamSecondsLeft(45);

          const entry = {
            id: `hist-${Date.now()}`,

            score: correctCount,
            total,
            percent: Math.round((correctCount / Math.max(1, total)) * 100),
            docsNames: [...new Set(sessionQuestions.map(q => q.docName))].slice(0, 3),
          };
          setHistory(prev => [entry, ...prev].slice(0, 50));
          setActiveTab('results');
        }
      }, [currentIndex, sessionQuestions, answersLog]);

      useEffect(() => {
        if (activeTab !== 'playing' || studyMode !== 'exam' || selectedOption !== null) return;
        const timer = setInterval(() => {
          setExamSecondsLeft(prev => {
            if (prev <= 1) {
              const currentQ = sessionQuestions[currentIndex];
              setSelectedOption('__TIMEOUT__');
              setAnswersLog(log => [...log, { question: currentQ, chosen: '—', isCorrect: false }]);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [activeTab, studyMode, selectedOption, currentIndex, sessionQuestions]);

      const startRetryErrors = () => {
        const wrongQuestions = answersLog.filter(a => !a.isCorrect).map(a => a.question);
        if (wrongQuestions.length === 0) return;
        setSessionQuestions(wrongQuestions);
        setCurrentIndex(0);
        setSelectedOption(null);
        setAnswersLog([]);
        setNailedItStamp(false);
        setExamSecondsLeft(45);
        setActiveTab('playing');
      };

      const handleFlashcardResult = (known) => {
        const [current, ...rest] = flashcardQueue;
        if (!current) return;
        setFlashcardFlipped(false);
        if (known) {

        const doc = docsMap.get(docId);

        e.preventDefault();
        setAuthError('');

          return;

        const email = sanitizeText(authEmail, 100).toLowerCase();
        if (!email.includes('@') || authPassword.length < 6) {
          setAuthError('Inserisci email valida e password di almeno 6 caratteri.');
          return;

        const usersDb = safeJsonParse(localStorage.getItem('nailedit_users_db'), {});

          const name = sanitizeText(authName, 60) || email.split('@')[0];
          const salt = generateSaltHex();
          const hash = await hashPasswordPBKDF2(authPassword, salt);
          usersDb[email] = { name, email, salt, hash };
          localStorage.setItem('nailedit_users_db', JSON.stringify(usersDb));
          const userObj = { name, email };
          setCurrentUser(userObj);
          localStorage.setItem('nailedit_user', JSON.stringify(userObj));
          setAuthPassword('');

          const record = usersDb[email];
          if (!record) {
            setLoginAttempts(a => a + 1);

          const checkHash = await hashPasswordPBKDF2(authPassword, record.salt);

            return;

          const userObj = { name: record.name, email: record.email };
          setCurrentUser(userObj);
          localStorage.setItem('nailedit_user', JSON.stringify(userObj));
          setAuthPassword('');
        }
      };

                          value={authEmail}
                          onChange={(e) => setAuthEmail(e.target.value)}
                          className="w-full px-3.5 py-2 rounded-xl border-2 border-zinc-900 dark:border-zinc-700 bg-white dark:bg-zinc-950 text-sm"
                        />
                        <input
                          type="password"
                          required
                          placeholder={t.passwordLabel}
                          value={authPassword}
                          onChange={(e) => setAuthPassword(e.target.value)}
                          className="w-full px-3.5 py-2 rounded-xl border-2 border-zinc-900 dark:border-zinc-700 bg-white dark:bg-zinc-950 text-sm"
                        />
                        {authError && <p className="text-xs font-bold text-red-600">{authError}</p>}
                        <button
                          type="submit"
                          className="px-5 py-2.5 rounded-xl bg-[#D95D39] text-white text-xs font-extrabold border-2 border-zinc-900 hard-shadow-sm"
                        >
                          {authMode === 'login' ? t.loginBtn : t.registerBtn}
                        </button>
                      </form>
                    )}
                  </div>

                  {/* Stats & History */}
                  <div className="bg-white dark:bg-zinc-900 border-2 border-zinc-900 dark:border-zinc-800 rounded-2xl p-6 hard-shadow space-y-4">
                    <div className="grid grid-cols-2 gap-4">
                      <div className="p-4 rounded-xl bg-[#F7F5EF] dark:bg-zinc-950 border-2 border-zinc-900 dark:border-zinc-700">
                        <div className="text-xs font-bold text-zinc-500">{t.sessionsDone}</div>
                        <div className="font-mono font-black text-2xl mt-1">{history.length}</div>
                      </div>
                      <div className="p-4 rounded-xl bg-[#F7F5EF] dark:bg-zinc-950 border-2 border-zinc-900 dark:border-zinc-700">
                        <div className="text-xs font-bold text-zinc-500">{t.avgScore}</div>
                        <div className="font-mono font-black text-2xl mt-1 text-[#2A7B5C]">{avgPercent}%</div>
                      </div>
                    </div>

                    <h3 className="font-serif font-bold text-lg pt-2">{t.historyTitle}</h3>
                    {history.length === 0 ? (
                      <p className="text-sm text-zinc-500">{t.noHistory}</p>
                    ) : (
                      <div className="space-y-2">
                        {history.map(item => (
                          <div
                            key={item.id}
                            className="p-3 rounded-xl border border-zinc-300 dark:border-zinc-700 flex items-center justify-between text-xs"
                          >
                            <div>
                              <div className="font-bold">{(item.docsNames || []).join(', ')}</div>
                              <div className="text-zinc-500 font-mono">{item.date}</div>
                            </div>
                            <span className="font-mono font-extrabold px-2.5 py-1 rounded-lg bg-emerald-100 dark:bg-emerald-950 text-emerald-900 dark:text-emerald-200">
                              {item.score}/{item.total} ({item.percent}%)
                            </span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* PDF Reference Modal */}
          {pdfViewerState && (
            <div className="fixed inset-0 z-50 bg-zinc-950/70 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white dark:bg-zinc-900 border-2 border-zinc-900 dark:border-zinc-700 rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col overflow-hidden hard-shadow">
                <div className="px-5 py-3.5 bg-amber-300 text-zinc-900 border-b-2 border-zinc-900 flex items-center justify-between">
                  <div className="font-bold text-sm truncate">
                    {t.pdfModalTitle} — {pdfViewerState.doc.name}
                  </div>
                  <button
                    onClick={() => setPdfViewerState(null)}
                    className="px-2.5 py-1 rounded-lg bg-zinc-900 text-white text-xs font-bold"
                  >
                    {t.closeModal}
                  </button>
                </div>

                <div className="px-5 py-2.5 bg-[#F7F5EF] dark:bg-zinc-950 border-b border-zinc-200 dark:border-zinc-800 flex items-center justify-between">
                  <button
                    disabled={pdfViewerState.pageNumber <= 1}
                    onClick={() =>
                      setPdfViewerState(s => ({ ...s, pageNumber: Math.max(1, s.pageNumber - 1) }))
                    }
                    className="px-3 py-1 rounded-lg border border-zinc-900 dark:border-zinc-700 text-xs font-bold disabled:opacity-40"
                  >
                    ← {t.prevPage}
                  </button>
                  <span className="font-mono text-xs font-bold">
                    {t.pageRef} {pdfViewerState.pageNumber} / {pdfViewerState.doc.numPages}
                  </span>
                  <button
                    disabled={pdfViewerState.pageNumber >= pdfViewerState.doc.numPages}
                    onClick={() =>
                      setPdfViewerState(s => ({
                        ...s,
                        pageNumber: Math.min(s.doc.numPages, s.pageNumber + 1),
                      }))
                    }
                    className="px-3 py-1 rounded-lg border border-zinc-900 dark:border-zinc-700 text-xs font-bold disabled:opacity-40"
                  >
                    {t.nextPage} →
                  </button>
                </div>

                <div className="p-6 overflow-y-auto text-sm leading-relaxed whitespace-pre-wrap">
                  {(pdfViewerState.doc.pages &&
                    pdfViewerState.doc.pages[pdfViewerState.pageNumber - 1]?.text) ||
                    'Nessun testo estraibile in questa pagina.'}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
