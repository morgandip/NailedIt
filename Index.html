<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NailedIt — Studia con quiz, flashcard e PDF locali." />
  <title>NailedIt — Studia più forte, colpisci nel segno.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .serif { font-family: 'Fraunces', Georgia, serif; }
    .paper { background-color: #f7f5ef; background-image: radial-gradient(#d6d1c4 .75px, transparent .75px); background-size: 18px 18px; }
    .dark .paper { background-color: #111113; background-image: radial-gradient(#29292e .75px, transparent .75px); }
    .shadow-hard { box-shadow: 4px 4px 0 #18181b; }
    .dark .shadow-hard { box-shadow: 4px 4px 0 #000; }
  </style>
</head>
<body class="paper text-zinc-900 dark:text-zinc-100">
  <div id="root"><noscript>Questa applicazione richiede JavaScript.</noscript></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    const MAX_FILES = 130;
    const MAX_FILE_BYTES = 35 * 1024 * 1024;
    const MAX_PAGES = 400;

    function safeArray(raw, fallback = []) {
      try { const value = JSON.parse(raw); return Array.isArray(value) ? value : fallback; }
      catch { return fallback; }
    }

    function readStore(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw == null) return fallback;
        const value = JSON.parse(raw);
        return value == null ? fallback : value;
      } catch { return fallback; }
    }

    function writeStore(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); return true; }
      catch { return false; }
    }

    function cleanText(value, max = 200) {
      return typeof value === 'string' ? value.replace(/[\u0000-\u001F\u007F]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max) : '';
    }

    async function extractPdf(file) {
      if (file.size > MAX_FILE_BYTES) throw new Error('Il file supera i 35 MB');
      if (!window.pdfjsLib) throw new Error('PDF.js non è disponibile');

      const buffer = await file.arrayBuffer();
      const signature = new TextDecoder('latin1').decode(new Uint8Array(buffer.slice(0, 5)));
      if (signature !== '%PDF-') throw new Error('Formato PDF non valido');

      const task = window.pdfjsLib.getDocument({ data: buffer, isEvalSupported: false });
      let pdf;
      try {
        pdf = await task.promise;
        const count = Math.min(pdf.numPages, MAX_PAGES);
        const pages = [];
        for (let number = 1; number <= count; number++) {
          const page = await pdf.getPage(number);
          const content = await page.getTextContent();
          const text = content.items.map(item => item.str || '').join(' ').replace(/\s+/g, ' ').trim();
          pages.push({ number, text });
          page.cleanup();
        }
        return { numPages: pdf.numPages, pages };
      } finally {
        if (pdf) pdf.destroy?.();
        task.destroy?.();
      }
    }

    function buildQuestions(docs, count) {
      const candidates = [];
      docs.forEach(doc => {
        (doc.pages || []).forEach(page => {
          const sentences = cleanText(page.text, 10000)
            .split(/(?<=[.!?])\s+/)
            .filter(sentence => sentence.length >= 40 && sentence.length <= 220);

          sentences.forEach(sentence => {
            const words = sentence
              .replace(/[^\p{L}\p{N}'-]+/gu, ' ')
              .split(/\s+/)
              .filter(word => word.length >= 6);

            const unique = [...new Set(words)].sort((a, b) => b.length - a.length);
            const answer = unique[0];
            if (!answer) return;

            const escaped = answer.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const masked = sentence.replace(new RegExp(`\\b${escaped}\\b`, 'iu'), '________');
            if (masked === sentence) return;

            candidates.push({
              id: `${doc.id}-${page.number}-${candidates.length}-${Math.random().toString(36).slice(2)}`,
              docId: doc.id,
              docName: doc.name,
              pageNumber: page.number,
              prompt: 'Completa il concetto estratto dal documento:',
              quote: masked,
              answer,
              explanation: sentence
            });
          });
        });
      });

      if (!candidates.length) return [];

      const shuffled = [...candidates].sort(() => Math.random() - 0.5);
      const selected = [];
      const seen = new Set();
      for (const candidate of shuffled) {
        const key = `${candidate.docId}:${candidate.quote}`;
        if (seen.has(key)) continue;
        seen.add(key);
        selected.push(candidate);
        if (selected.length === count) break;
      }

      const allWords = [...new Set(candidates.map(item => item.answer))];
      return selected.map(item => {
        const distractors = allWords
          .filter(word => word.toLocaleLowerCase() !== item.answer.toLocaleLowerCase())
          .sort(() => Math.random() - 0.5)
          .slice(0, 3);
        while (distractors.length < 3) distractors.push(`Termine ${distractors.length + 1}`);
        const options = [item.answer, ...distractors].sort(() => Math.random() - 0.5);
        return { ...item, options, correctAnswer: item.answer };
      });
    }

    function App() {
      const [dark, setDark] = useState(() => localStorage.getItem('nailedit_dark') === 'true');
      const [tab, setTab] = useState('quiz');
      const [docs, setDocs] = useState(() => safeArray(localStorage.getItem('nailedit_docs')));
      const [folders, setFolders] = useState(() => safeArray(localStorage.getItem('nailedit_folders')));
      const [selected, setSelected] = useState(() => safeArray(localStorage.getItem('nailedit_selected')));
      const [history, setHistory] = useState(() => safeArray(localStorage.getItem('nailedit_history')));
      const [folderName, setFolderName] = useState('');
      const [uploadFolder, setUploadFolder] = useState('');
      const [busy, setBusy] = useState(false);
      const [uploadError, setUploadError] = useState('');
      const [questionCount, setQuestionCount] = useState(10);
      const [mode, setMode] = useState('classic');
      const [questions, setQuestions] = useState([]);
      const [index, setIndex] = useState(0);
      const [chosen, setChosen] = useState(null);
      const [answers, setAnswers] = useState([]);
      const [seconds, setSeconds] = useState(45);
      const [viewer, setViewer] = useState(null);
      const [renderedPage, setRenderedPage] = useState(null);
      const fileRef = useRef(null);

      useEffect(() => {
        document.documentElement.classList.toggle('dark', dark);
        localStorage.setItem('nailedit_dark', String(dark));
      }, [dark]);

      useEffect(() => { writeStore('nailedit_docs', docs); }, [docs]);
      useEffect(() => { writeStore('nailedit_folders', folders); }, [folders]);
      useEffect(() => { writeStore('nailedit_selected', selected); }, [selected]);
      useEffect(() => { writeStore('nailedit_history', history); }, [history]);

      useEffect(() => {
        if (tab !== 'playing' || mode !== 'exam' || chosen !== null) return;
        const timer = setInterval(() => {
          setSeconds(previous => {
            if (previous <= 1) {
              clearInterval(timer);
              const question = questions[index];
              setChosen('__timeout__');
              setAnswers(previousAnswers => [...previousAnswers, { question, isCorrect: false }]);
              return 0;
            }
            return previous - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [tab, mode, chosen, index, questions]);

      useEffect(() => {
        if (!viewer || !window.pdfjsLib) { setRenderedPage(null); return; }
        let cancelled = false;
        setRenderedPage(null);
        const load = async () => {
          try {
            const task = window.pdfjsLib.getDocument({ data: viewer.bytes, isEvalSupported: false });
            const pdf = await task.promise;
            const page = await pdf.getPage(viewer.pageNumber);
            const viewport = page.getViewport({ scale: 1.25 });
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            await page.render({ canvasContext: context, viewport }).promise;
            if (!cancelled) setRenderedPage(canvas.toDataURL('image/png'));
            page.cleanup();
            pdf.destroy?.();
            task.destroy?.();
          } catch {
            if (!cancelled) setRenderedPage(null);
          }
        };
        load();
        return () => { cancelled = true; };
      }, [viewer]);

      useEffect(() => {
        if (!viewer) return;
        const close = event => { if (event.key === 'Escape') setViewer(null); };
        window.addEventListener('keydown', close);
        return () => window.removeEventListener('keydown', close);
      }, [viewer]);

      const docsMap = useMemo(() => new Map(docs.map(doc => [doc.id, doc])), [docs]);
      const selectedDocs = useMemo(() => selected.map(id => docsMap.get(id)).filter(Boolean), [selected, docsMap]);

      async function uploadFiles(fileList) {
        setUploadError('');
        const files = Array.from(fileList || []).filter(file => file.type === 'application/pdf' || file.name.toLower?.().endsWith('.pdf'));
        if (!files.length) { setUploadError('Seleziona almeno un file PDF valido'); return; }

        const remaining = MAX_FILES - docs.length;
        if (remaining <= 0) { setUploadError(`Limite massimo: ${MAX_FILES} PDF`); return; }

        setBusy(true);
        const added = [];
        const errors = [];
        for (const file of files.slice(0, remaining)) {
          try {
            const parsed = await extractPdf(file);
            const bytes = await file.arrayBuffer();
            let base64 = '';
            const bytesView = new Uint8Array(bytes);
            const chunkSize = 0x8000;
            for (let offset = 0; offset < bytesView.length; offset += chunkSize) {
              base64 += String.fromCharCode(...bytesView.subarray(offset, offset + chunkSize));
            }
            added.push({
              id: `doc-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
              name: cleanText(file.name, 120),
              folderId: uploadFolder,
              numPages: parsed.numPages,
              pages: parsed.pages,
              base64: btoa(base64)
            });
          } catch (error) { errors.push(`${file.name}: ${error.message}`); }
        }
        if (added.length) {
          setDocs(previous => [...previous, ...added]);
          setSelected(previous => [...new Set([...previous, ...added.map(doc => doc.id)])]);
        }
        if (errors.length) setUploadError(errors.join(' • '));
        setBusy(false);
      }

      function createFolder(event) {
        event.preventDefault();
        const name = cleanText(folderName, 60);
        if (!name) return;
        setFolders(previous => [...previous, { id: `folder-${Date.now()}`, name }]);
        setFolderName('');
      }

      function toggleFolder(folderId) {
        const ids = docs.filter(doc => doc.folderId === folderId).map(doc => doc.id);
        if (!ids.length) return;
        setSelected(previous => {
          const all = ids.every(id => previous.includes(id));
          return all ? previous.filter(id => !ids.includes(id)) : [...new Set([...previous, ...ids])];
        });
      }

      function startSession(targetDocs = selectedDocs, overrideMode = mode) {
        if (!targetDocs.length) return;
        const count = Math.min(30, Math.max(1, Number(questionCount) || 10));
        const generated = buildQuestions(targetDocs, count);
        if (!generated.length) { setUploadError('Nessun testo estraibile: prova un PDF con testo selezionabile'); return; }
        setQuestions(generated);
        setIndex(0);
        setChosen(null);
        setAnswers([]);
        setSeconds(45);
        setMode(overrideMode);
        setTab('playing');
      }

      function selectAnswer(option) {
        if (chosen !== null) return;
        const question = questions[index];
        const correct = option === question.correctAnswer;
        setChosen(option);
        setAnswers(previous => [...previous, { question, isCorrect: correct }]);
      }

      function nextQuestion() {
        if (index + 1 < questions.length) {
          setIndex(previous => previous + 1);
          setChosen(null);
          setSeconds(45);
        } else {
          const score = answers.filter(answer => answer.isCorrect).length;
          const entry = {
            id: `history-${Date.now()}`,
            date: new Date().toLocaleDateString(),
            score,
            total: questions.length,
            percent: Math.round(score / Math.max(1, questions.length) * 100),
            docs: [...new Set(questions.map(question => question.docName))].slice(0, 3)
          };
          setHistory(previous => [entry, ...previous].slice(0, 50));
          setTab('results');
        }
      }

      function openPdf(docId, pageNumber) {
        const doc = docsMap.get(docId);
        if (!doc?.base64) return;
        const binary = atob(doc.base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        setViewer({ doc, pageNumber: Math.min(Math.max(1, pageNumber), doc.numPages), bytes });
      }

      function closeModal() { setViewer(null); }

      const current = questions[index];
      const average = history.length ? Math.round(history.reduce((sum, item) => sum + (item.percent || 0), 0) / history.length) : 0;

      return (
        <div className="min-h-screen">
          <header className="sticky top-0 z-30 border-b-2 border-zinc-900 bg-[#f7f5ef]/95 dark:bg-[#111113]/95">
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
              <button onClick={() => setTab('quiz')} className="serif text-xl font-black">NailedIt</button>
              <button onClick={() => setDark(value => !value)} className="border-2 border-zinc-900 px-3 py-1 rounded-lg" aria-label="Cambia tema">{dark ? '☀️' : '🌙'}</button>
            </div>
          </header>

          <div className="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            <aside className="lg:col-span-3">
              <nav className="bg-white dark:bg-zinc-900 border-2 border-zinc-900 rounded-xl p-2 space-y-2 shadow-hard">
                {[['quiz','🎯','Quiz'], ['files','📂','File'], ['history','📊','Cronologia']].map(([id, icon, label]) => (
                  <button key={id} onClick={() => setTab(id)} className={`w-full text-left px-3 py-2 rounded-lg font-bold ${tab === id ? 'bg-[#d95d39] text-white' : 'hover:bg-zinc-100 dark:hover:bg-zinc-800'}`}>
                    {icon} {label}
                  </button>
                ))}
              </nav>
            </aside>

            <main className="lg:col-span-9 space-y-6">
              {tab === 'quiz' && (
                <section className="bg-white dark:bg-zinc-900 border-2 border-zinc-900 rounded-2xl p-6 shadow-hard space-y-5">
                  <h1 className="serif text-3xl font-black">Cosa studiamo oggi?</h1>
                  <p class="text-zinc-600 dark:text-zinc-400">Seleziona i PDF e scegli il tipo di sessione.</p>

                  <button onClick={() => fileRef.current?.click()} className="border-2 border-zinc-900 px-4 py-2 rounded-lg bg-amber-300 text-zinc-900 font-bold">
                    Scegli file ({selectedDocs.length})
                  </button>
                  <input ref={fileRef} hidden type="file" accept="application/pdf,.pdf" multiple onChange={event => uploadFiles(event.target.files)} />

                  {docs.length > 0 && (
                    <div class="grid sm:grid-cols-2 gap-2">
                      {docs.map(doc => (
                        <label key={doc.id} class="border rounded-lg px-3 py-2 flex gap-2 items-center">
                          <input type="checkbox" checked={selected.includes(doc.id)} onChange={() => setSelected(previous => previous.includes(doc.id) ? previous.filter(id => id !== doc.id) : [...previous, doc.id])} />
                          <span class="truncate text-sm">{doc.name}</span>
                        </label>
                      ))}
                    </div>
                  )}

                  <div className="flex flex-wrap gap-2">
                    {['classic','exam','flashcard'].map(value => (
                      <button key={value} onClick={() => setMode(value)} className={`border-2 px-3 py-2 rounded-lg ${mode === value ? 'border-zinc-900 bg-amber-200 text-zinc-900' : 'border-zinc-300'}`}>
                        {value === 'classic' ? 'Quiz' : value === 'exam' ? 'Esame 45s' : 'Flashcard'}
                      </button>
                    ))}
                  </div>

                  <div className="flex items-end gap-3">
                    <label className="text-sm font-bold">Domande
                      <input className="block mt-1 w-24 border-2 border-zinc-900 rounded-lg px-3 py-2 bg-white text-zinc-900" type="number" min="1" max="30" value={questionCount} onChange={event => setQuestionCount(event.target.value)} />
                    </label>
                    <button disabled={!selectedDocs.length} onClick={() => startSession()} className="bg-[#d95d39] disabled:opacity-40 text-white border-2 border-zinc-900 px-5 py-2 rounded-lg font-bold shadow-hard">Inizia sessione</button>
                  </div>
                </section>
              )}

              {tab === 'files' && (
                <section className="space-y-6">
                  <div onDragOver={event => event.preventDefault()} onDrop={event => { event.preventDefault(); uploadFiles(event.dataTransfer.files); }} onClick={() => fileRef.current?.click()} className="cursor-pointer border-2 border-dashed border-zinc-900 rounded-2xl p-8 text-center bg-white dark:bg-zinc-900">
                    <input ref={fileRef} hidden type="file" accept="application/pdf,.pdf" multiple onChange={event => uploadFiles(event.target.files)} />
                    <strong>{busy ? 'Elaborazione in corso...' : 'Trascina i PDF oppure clicca'}</strong>
                    <p className="text-xs text-zinc-500 mt-2">Fino a 130 PDF • 35 MB ciascuno • fino a 400 pagine per PDF</p>
                  </div>

                  {uploadError && <div role="alert" className="border-2 border-red-500 bg-red-50 text-red-800 px-4 py-3 rounded-xl text-sm">{uploadError}</div>}

                  <div className="bg-white dark:bg-zinc-900 border-2 border-zinc-900 rounded-2xl p-5 shadow-hard">
                    <h2 className="serif text-xl font-black mb-3">Cartelle</h2>
                    <form onSubmit={createFolder} className="flex gap-2 mb-4">
                      <input value={folderName} onChange={event => setFolderName(event.target.value)} placeholder="Nome cartella" className="border-2 border-zinc-900 rounded-lg px-3 py-2 bg-white text-zinc-900" />
                      <button className="border-2 border-zinc-900 rounded-lg px-3 font-bold">Crea</button>
                    </form>
                    {folders.map(folder => {
                      const folderDocs = docs.filter(doc => doc.folderId === folder.id);
                      return (
                        <div key={folder.id} className="border rounded-xl p-3 mb-2 flex flex-wrap items-center justify-between gap-2">
                          <strong>{folder.name} ({folderDocs.length})</strong>
                          <div className="flex gap-2">
                            <button onClick={() => toggleFolder(folder.id)} className="border px-2 py-1 rounded-lg text-xs">Seleziona/Deseleziona</button>
                            <button disabled={!folderDocs.length} onClick={() => startSession(folderDocs)} className="border px-2 py-1 rounded-lg text-xs bg-amber-200 text-zinc-900">Quiz cartella</button>
                            <button onClick={() => { if (confirm(`Eliminare la cartella ${folder.name}?`)) { setFolders(previous => previous.filter(item => item.id !== folder.id)); setDocs(previous => previous.map(doc => doc.folderId === folder.id ? { ...doc, folderId: '' } : doc)); } }} className="text-red-600 text-xs font-bold">Elimina</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  <div className="bg-white dark:bg-zinc-900 border-2 border-zinc-900 rounded-2xl p-5 shadow-hard">
                    <h2 className="serif text-xl font-black mb-3">Libreria ({docs.length}/{MAX_FILES})</h2>
                    {folders.length > 0 && (
                      <label className="block mb-3 text-sm">Assegna nuovi caricamenti:
                        <select value={uploadFolder} onChange={event => setUploadFolder(event.target.value)} className="ml-2 border rounded px-2 py-1 bg-white text-zinc-900">
                          <option value="">Nessuna</option>
                          {folders.map(folder => <option key={folder.id} value={folder.id}>{folder.name}</option>)}
                        </select>
                      </label>
                    )}
                    {!docs.length && <p class="text-sm text-zinc-500">Nessun PDF caricato.</p>}
                    {docs.map(doc => (
                      <div key={doc.id} className="border rounded-xl p-3 mb-2 flex flex-wrap items-center justify-between gap-3">
                        <label className="flex gap-2 items-center min-w-0">
                          <input type="checkbox" checked={selected.includes(doc.id)} onChange={() => setSelected(previous => previous.includes(doc.id) ? previous.filter(id => id !== doc.id) : [...previous, doc.id])} />
                          <span className="truncate text-sm font-bold">{doc.name} · {doc.numPages} pag.</span>
                        </label>
                        <div className="flex items-center gap-2">
                          {folders.length > 0 && (
                            <select aria-label={`Cartella per ${doc.name}`} value={doc.folderId || ''} onChange={event => setDocs(previous => previous.map(item => item.id === doc.id ? { ...item, folderId: event.target.value } : item))} className="border rounded px-2 py-1 bg-white text-zinc-900 text-xs">
                              <option value="">Nessuna</option>
                              {folders.map(folder => <option key={folder.id} value={folder.id}>{folder.name}</option>)}
                            </select>
                          )}
                          <button onClick={() => openPdf(doc.id, 1)} className="border px-2 py-1 rounded-lg text-xs bg-amber-200 text-zinc-900">Apri pagina</button>
                          <button onClick={() => { if (confirm(`Eliminare ${doc.name}?`)) { setDocs(previous => previous.filter(item => item.id !== doc.id)); setSelected(previous => previous.filter(id => id !== doc.id)); } }} className="text-red-600 text-xs font-bold">Elimina</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>
              )}

              {tab === 'playing' && current && (
                <section className="bg-white dark:bg-zinc-900 border-2 border-zinc-900 rounded-2xl p-6 shadow-hard space-y-5">
                  <div className="flex items-center justify-between">
                    <span className="font-mono text-xs">Domanda {index + 1}/{questions.length}</span>
                    {mode === 'exam' && <span className="font-mono border px-2 py-1 rounded-lg">⏱ {seconds}s</span>}
                    <button onClick={() => setTab('quiz')} className="text-xs font-bold">Esci</button>
                  </div>
                  <blockquote className="border-l-4 border-[#d95d39] bg-[#f7f5ef] dark:bg-zinc-950 p-4 rounded-xl">“{current.quote}”</blockquote>
                  <div className="space-y-2">
                    {current.options.map((option, optionIndex) => {
                      let style = 'border-zinc-300';
                      if (chosen !== null) {
                        if (option === current.correctAnswer) style = 'border-emerald-600 bg-emerald-100 text-emerald-950';
                        else if (option === chosen) style = 'border-red-600 bg-red-100 text-red-950';
                        else style = 'opacity-50';
                      }
                      return (
                        <button key={optionIndex} disabled={chosen !== null} onClick={() => selectAnswer(option)} className={`w-full border-2 rounded-xl px-4 py-3 text-left ${style}`}>
                          {String.fromCharCode(65 + optionIndex)}. {option}
                        </button>
                      );
                    })}
                  </div>
                  {chosen !== null && (
                    <div className="border-t pt-4 space-y-3">
                      <p className="text-sm"><strong>Origine:</strong> {current.docName} · Pagina {current.pageNumber}</p>
                      <p className="text-sm text-zinc-600 dark:text-zinc-400">{current.explanation}</p>
                      <div className="flex justify-between">
                        <button onClick={() => openPdf(current.docId, current.pageNumber)} className="border px-3 py-2 rounded-lg bg-amber-200 text-zinc-900 text-xs font-bold">Apri pagina</button>
                        <button onClick={nextQuestion} className="border-2 border-zinc-900 px-4 py-2 rounded-lg bg-[#d95d39] text-white font-bold">{index + 1 < questions.length ? 'Prossima' : 'Risultati'}</button>
                      </div>
                    </div>
                  )}
                </section>
              )}

              {tab === 'results' && (
                <section className="bg-white dark:bg-zinc-900 border-2 border-zinc-900 rounded-2xl p-8 shadow-hard text-center space-y-5">
                  <h1 className="serif text-3xl font-black">Sessione completata!</h1>
                  <p className="text-5xl font-black text-[#d95d39]">{answers.filter(answer => answer.isCorrect).length}/{questions.length}</p>
                  <button onClick={() => setTab('quiz')} className="border-2 border-zinc-900 px-5 py-2 rounded-lg">Torna alla home</button>
                </section>
              )}

              {tab === 'history' && (
                <section className="bg-white dark:bg-zinc-900 border-2 border-zinc-900 rounded-2xl p-6 shadow-hard space-y-4">
                  <h1 className="serif text-2xl font-black">Cronologia</h1>
                  <div className="grid grid-cols-2 gap-3">
                    <div className="border rounded-xl p-4"><span className="text-xs">Sessioni</span><strong className="block text-2xl">{history.length}</strong></div>
                    <div className="border rounded-xl p-4"><span className="text-xs">Media</span><strong className="block text-2xl">{average}%</strong></div>
                  </div>
                  {!history.length && <p className="text-sm text-zinc-500">Nessuna sessione completata.</p>}
                  {history.map(item => (
                    <div key={item.id} className="border rounded-xl p-3 flex justify-between text-sm">
                      <div><strong>{item.docs.join(', ')}</strong><div className="text-zinc-500">{item.date}</div></div>
                      <strong>{item.score}/{item.total} ({item.percent}%)</strong>
                    </div>
                  ))}
                </section>
              )}
            </main>
          </div>

          {viewer && (
            <div role="dialog" aria-modal="true" aria-label="Anteprima PDF" onMouseDown={event => { if (event.target === event.currentTarget) closeModal(); }} className="fixed inset-0 z-50 bg-zinc-950/70 p-4 flex items-center justify-center">
              <div className="bg-white dark:bg-zinc-900 border-2 border-zinc-900 rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden shadow-hard">
                <div className="px-4 py-3 border-b flex justify-between gap-3">
                  <strong className="truncate">{viewer.doc.name}</strong>
                  <button autoFocus onClick={closeModal} className="border px-2 py-1 rounded-lg">Chiudi</button>
                </div>
                <div class="px-4 py-2 border-b flex items-center justify-between">
                  <button disabled={viewer.pageNumber <= 1} onClick={() => setViewer(previous => ({ ...previous, pageNumber: previous.pageNumber - 1 }))} className="border px-3 py-1 rounded-lg disabled:opacity-40">Prec.</button>
                  <span class="font-mono text-xs">Pagina {viewer.pageNumber}/{viewer.doc.numPages}</span>
                  <button disabled={viewer.pageNumber >= viewer.doc.numPages} onClick={() => setViewer(previous => ({ ...previous, pageNumber: previous.pageNumber + 1 }))} className="border px-3 py-1 rounded-lg disabled:opacity-40">Succ.</button>
                </div>
                <div className="overflow-auto p-4 flex justify-center bg-zinc-200 dark:bg-zinc-950">
                  {renderedPage ? <img src={renderedPage} alt={`Pagina ${viewer.pageNumber}`} className="max-w-full h-auto shadow" /> : <p className="py-10">Lettura pagina PDF...</p>}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
